name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

defaults:
  run:
    working-directory: IptvPlayer

jobs:
  build:
    name: Build debug & release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Decode release keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        continue-on-error: true
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-debug
          path: IptvPlayer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-release
          path: IptvPlayer/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # ---- Publish a GitHub Release so the in-app updater can find a build. ----
      # Prefer the release APK signed with the STABLE keystore (from secrets): only
      # a stable signature lets users install each update over the previous one
      # without losing their data. Fall back to the debug APK when signing secrets
      # are absent, so the pipeline still produces an installable build.
      - name: Stage APK for release
        if: github.event_name != 'pull_request'
        id: stage
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets
          RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          if [ -n "$KEYSTORE_BASE64" ] && [ -f "$RELEASE_APK" ]; then
            echo "Publishing stable-signed release APK."
            cp "$RELEASE_APK" "release-assets/KululuIPTV-v${VER}.apk"
          else
            echo "No signing secrets or release APK present; falling back to debug APK."
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/KululuIPTV-v${VER}.apk"
          fi

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.stage.outputs.version }}
          name: Kululu IPTV v${{ steps.stage.outputs.version }}
          body: Automated build from commit ${{ github.sha }}.
          make_latest: true
          files: IptvPlayer/release-assets/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
