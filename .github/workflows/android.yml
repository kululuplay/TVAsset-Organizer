name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: IptvPlayer

jobs:
  ffmpeg-extension:
    # Media3's FFmpeg audio decoder extension is not on Maven: build it from
    # source (scripts/ffmpeg/build_media3_ffmpeg.sh, pins in versions.env) and
    # hand the AAR to the app jobs. The result is cached on every pinned input
    # so a normal run restores in seconds; only a version/script/NDK bump
    # rebuilds FFmpeg (~15-20 min). See docs/ffmpeg-audio.md.
    name: Media3 FFmpeg audio extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.pins.outputs.cache-key }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read pinned versions
        id: pins
        working-directory: .
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/ffmpeg/versions.env
          for name in MEDIA3_VERSION FFMPEG_TAG NDK_VERSION CMAKE_VERSION ANDROID_ABI_LEVEL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name missing from scripts/ffmpeg/versions.env"
              exit 1
            fi
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          python3 scripts/ffmpeg/verify_media3_ffmpeg.py --check-pins
          python3 scripts/ffmpeg/test_verify_media3_ffmpeg.py
          script_hash=$(python3 scripts/ffmpeg/verify_media3_ffmpeg.py --recipe-hash)
          echo "cache-key=media3-ffmpeg-aar-v2-media3_${MEDIA3_VERSION}-ffmpeg_${FFMPEG_TAG}-script_${script_hash}-ndk_${NDK_VERSION}-api_${ANDROID_ABI_LEVEL}" >> "$GITHUB_OUTPUT"

      - name: Restore cached extension AAR
        id: aar-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            IptvPlayer/app/libs/media3-decoder-ffmpeg-release.aar
            IptvPlayer/app/libs/media3-decoder-ffmpeg-release.txt
          key: ${{ steps.pins.outputs.cache-key }}

      - name: Set up JDK 17
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK and CMake
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }} cmake;${{ env.CMAKE_VERSION }}
          log-accepted-android-sdk-licenses: false

      - name: Build FFmpeg and the Media3 decoder AAR
        if: steps.aar-cache.outputs.cache-hit != 'true'
        working-directory: .
        env:
          FFMPEG_WORK_DIR: ${{ runner.temp }}/media3-ffmpeg-build
        run: bash scripts/ffmpeg/build_media3_ffmpeg.sh

      - name: Verify extension AAR
        working-directory: .
        run: |
          set -euo pipefail
          python3 scripts/ffmpeg/verify_media3_ffmpeg.py
          echo "cache-hit=${{ steps.aar-cache.outputs.cache-hit }}"

      - name: Upload extension AAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media3-decoder-ffmpeg
          path: |
            IptvPlayer/app/libs/media3-decoder-ffmpeg-release.aar
            IptvPlayer/app/libs/media3-decoder-ffmpeg-release.txt
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Test, lint and debug build
    needs: ffmpeg-extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: support_test
          POSTGRES_PASSWORD: support_test
          POSTGRES_DB: kululu_support
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U support_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUPPORT_TEST_DATABASE_URL: postgresql://support_test:support_test@127.0.0.1:5432/kululu_support
      # Pull requests build without the production keys: a debug APK compiled
      # from an untrusted branch must not carry them, and its artifact is not
      # retained. Pushes to the default branch keep the full behaviour.
      # (`cond && '' || secret` would always yield the secret: '' is falsy in
      # the expression language, so the ternary must put the secret first.)
      TMDB_API_KEY: ${{ github.event_name != 'pull_request' && secrets.TMDB_API_KEY || '' }}
      TELEMETRY_INGEST_KEY: ${{ github.event_name != 'pull_request' && secrets.TELEMETRY_INGEST_KEY || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            IptvPlayer/*.gradle.kts
            IptvPlayer/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - name: Scan current tree for secrets
        working-directory: .
        run: python3 scripts/scan_secrets.py

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # After the secret scan (binary AAR is not part of the tree scan) and
      # before Gradle configures: app/build.gradle.kts detects the AAR on disk.
      - name: Download Media3 FFmpeg extension AAR
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: media3-decoder-ffmpeg
          path: IptvPlayer/app/libs

      - name: Require the FFmpeg extension
        working-directory: .
        run: python3 scripts/ffmpeg/verify_media3_ffmpeg.py

      - name: Test telemetry receiver and release verifier
        working-directory: .
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          python3 scripts/test_verify_android_upgrade.py
          python3 scripts/test_activate_release_rollout.py

      - name: Test, lint and assemble APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease \
            --stacktrace

      - name: Verify Android playback support contract
        working-directory: .
        run: node scripts/verify_support_contract.js

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unit-tests
          path: IptvPlayer/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iptv-player-debug
          path: IptvPlayer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint
          path: IptvPlayer/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    name: Signed release
    needs: [verify, ffmpeg-extension]
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TELEMETRY_INGEST_KEY: ${{ secrets.TELEMETRY_INGEST_KEY }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release commit belongs to the default branch
        working-directory: .
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${GITHUB_REF_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            IptvPlayer/*.gradle.kts
            IptvPlayer/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      # Production always ships FFmpeg audio: a missing AAR fails the release
      # here (download-artifact errors) and again in the check below.
      - name: Download Media3 FFmpeg extension AAR
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: media3-decoder-ffmpeg
          path: IptvPlayer/app/libs

      - name: Require the FFmpeg extension
        working-directory: .
        run: python3 scripts/ffmpeg/verify_media3_ffmpeg.py

      - name: Validate release secrets
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for a signed release"
              exit 1
            fi
          done

      - name: Decode release keystore
        id: keystore
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Verify MPEG decoder resource packaging
        # R8 must preserve JLayer's synthesis resource as well as its license,
        # and the FFmpeg extension's native library must be packaged for every
        # shipped ABI. Check the final minified artifact before it can become
        # an update. Version metadata is read in the following step.
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          required = {
              "javazoom/jl/decoder/sfd.ser",
              "assets/licenses/LGPL-2.1.txt",
              "assets/licenses/JLayer-NOTICE.txt",
              "assets/licenses/FFmpeg-NOTICE.txt",
          }
          for abi in ("armeabi-v7a", "arm64-v8a", "x86", "x86_64"):
              required.add(f"lib/{abi}/libffmpegJNI.so")
          with ZipFile("app/build/outputs/apk/release/app-release.apk") as apk:
              names = set(apk.namelist())
              missing = required - names
              if missing:
                  raise SystemExit("Missing decoder resources: " + ", ".join(sorted(missing)))
              if not any(n.startswith("assets/licenses/") for n in names):
                  raise SystemExit("assets/licenses/ missing from APK")
          print("MPEG decoder, FFmpeg extension and license packaging verified")
          PY

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          package=$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$name" ] || [ -z "$code" ] || [ -z "$package" ]; then
            echo "::error::Could not read applicationId/versionCode/versionName"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Locate immutable release baseline
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_tag="v${{ steps.version.outputs.name }}"
          if gh release view "$current_tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "baseline_tag=$current_tag" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            # This repository already has production releases. A network/API
            # failure must fail closed instead of silently skipping the signing
            # certificate and monotonic-version comparison.
            latest_tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
            echo "baseline_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Download previous signed APK
        id: baseline
        if: steps.existing.outputs.baseline_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          destination="$RUNNER_TEMP/previous-release"
          mkdir -p "$destination"
          gh release download "${{ steps.existing.outputs.baseline_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.apk' \
            --dir "$destination"
          mapfile -t apks < <(find "$destination" -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK in baseline release; found ${#apks[@]}"
            exit 1
          fi
          echo "apk=${apks[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify signed APK and static upgrade compatibility
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          aapt="$build_tools/aapt"
          apksigner="$build_tools/apksigner"
          if [ ! -x "$aapt" ] || [ ! -x "$apksigner" ]; then
            echo "::error::aapt/apksigner not found in Android build-tools"
            exit 1
          fi
          args=(
            --new-apk app/build/outputs/apk/release/app-release.apk
            --expected-package "${{ steps.version.outputs.package }}"
            --expected-version-code "${{ steps.version.outputs.code }}"
            --expected-version-name "${{ steps.version.outputs.name }}"
            --aapt "$aapt"
            --apksigner "$apksigner"
          )
          if [ -n "${{ steps.baseline.outputs.apk }}" ]; then
            args+=(--previous-apk "${{ steps.baseline.outputs.apk }}")
          fi
          if [ "${{ steps.existing.outputs.exists }}" = "true" ]; then
            args+=(--allow-same-version)
          fi
          python3 ../scripts/verify_android_upgrade.py "${args[@]}"

      - name: Stage release APK
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk \
            "release-assets/KululuIPTV-v${{ steps.version.outputs.name }}.apk"
          notes="release-notes/v${{ steps.version.outputs.name }}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-assets/RELEASE_NOTES.md
          else
            printf '%s\n' 'Bug fixes and stability improvements.' > release-assets/RELEASE_NOTES.md
          fi

      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Kululu IPTV v${{ steps.version.outputs.name }}
          body_path: IptvPlayer/release-assets/RELEASE_NOTES.md
          make_latest: true
          files: IptvPlayer/release-assets/*.apk
          fail_on_unmatched_files: true

      - name: Enable in-app rollout for the published release
        # Every verified production release is live for all users by default
        # (rolloutPercent 100, see UPDATE_ROLLOUT.md). Only a new publication
        # enables distribution: rebuilding an existing version skips this step,
        # and the script itself refuses to overwrite an operator pause/emergency
        # on the same version unless run by hand with --force.
        if: steps.existing.outputs.exists == 'false'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/activate_release_rollout.py \
            --repo "${{ github.repository }}" \
            --version "${{ steps.version.outputs.name }}" \
            --verified-apk "IptvPlayer/release-assets/KululuIPTV-v${{ steps.version.outputs.name }}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iptv-player-release
          path: IptvPlayer/release-assets/*.apk
          if-no-files-found: error
