name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: IptvPlayer

jobs:
  verify:
    name: Test, lint and debug build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TELEMETRY_INGEST_KEY: ${{ secrets.TELEMETRY_INGEST_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            IptvPlayer/*.gradle.kts
            IptvPlayer/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Scan current tree for secrets
        working-directory: .
        run: python3 scripts/scan_secrets.py

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test telemetry receiver and release verifier
        working-directory: .
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          python3 scripts/test_verify_android_upgrade.py

      - name: Test, lint and assemble debug
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iptv-player-debug
          path: IptvPlayer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint
          path: IptvPlayer/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    name: Signed release
    needs: verify
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TELEMETRY_INGEST_KEY: ${{ secrets.TELEMETRY_INGEST_KEY }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release commit belongs to the default branch
        working-directory: .
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${GITHUB_REF_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            IptvPlayer/*.gradle.kts
            IptvPlayer/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Validate release secrets
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for a signed release"
              exit 1
            fi
          done

      - name: Decode release keystore
        id: keystore
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          package=$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$name" ] || [ -z "$code" ] || [ -z "$package" ]; then
            echo "::error::Could not read applicationId/versionCode/versionName"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Locate immutable release baseline
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_tag="v${{ steps.version.outputs.name }}"
          if gh release view "$current_tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "baseline_tag=$current_tag" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            # This repository already has production releases. A network/API
            # failure must fail closed instead of silently skipping the signing
            # certificate and monotonic-version comparison.
            latest_tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
            echo "baseline_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Download previous signed APK
        id: baseline
        if: steps.existing.outputs.baseline_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          destination="$RUNNER_TEMP/previous-release"
          mkdir -p "$destination"
          gh release download "${{ steps.existing.outputs.baseline_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.apk' \
            --dir "$destination"
          mapfile -t apks < <(find "$destination" -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK in baseline release; found ${#apks[@]}"
            exit 1
          fi
          echo "apk=${apks[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify signed APK and static upgrade compatibility
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          aapt="$build_tools/aapt"
          apksigner="$build_tools/apksigner"
          if [ ! -x "$aapt" ] || [ ! -x "$apksigner" ]; then
            echo "::error::aapt/apksigner not found in Android build-tools"
            exit 1
          fi
          args=(
            --new-apk app/build/outputs/apk/release/app-release.apk
            --expected-package "${{ steps.version.outputs.package }}"
            --expected-version-code "${{ steps.version.outputs.code }}"
            --expected-version-name "${{ steps.version.outputs.name }}"
            --aapt "$aapt"
            --apksigner "$apksigner"
          )
          if [ -n "${{ steps.baseline.outputs.apk }}" ]; then
            args+=(--previous-apk "${{ steps.baseline.outputs.apk }}")
          fi
          if [ "${{ steps.existing.outputs.exists }}" = "true" ]; then
            args+=(--allow-same-version)
          fi
          python3 ../scripts/verify_android_upgrade.py "${args[@]}"

      - name: Stage release APK
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk \
            "release-assets/KululuIPTV-v${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Kululu IPTV v${{ steps.version.outputs.name }}
          body: Bug fixes and stability improvements.
          make_latest: true
          files: IptvPlayer/release-assets/*.apk
          fail_on_unmatched_files: true

      - name: Upload signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iptv-player-release
          path: IptvPlayer/release-assets/*.apk
          if-no-files-found: error
