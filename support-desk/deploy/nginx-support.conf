server {
    listen 8443 ssl default_server;
    server_name 212.95.41.130;
    ssl_certificate /etc/kululu-support/acme/live/support-ip/fullchain.pem;
    ssl_certificate_key /etc/kululu-support/acme/live/support-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KululuSupport:5m;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 192k;
    client_body_timeout 15s;
    # Keep cookies, bearer headers, messages and IP addresses out of access logs.
    access_log off;
    error_log /var/log/nginx/kululu-support-error.log warn;
    location / {
        proxy_pass http://127.0.0.1:5086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 20s;
    }
}
